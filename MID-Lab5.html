<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Diet & Exercise Tracker</title>
</head>
<body margin="5px">
    <table width="90%" align="center" cellpadding="10" cellspacing="0">
        <tr>
            <td colspan="2" align="center" bgcolor="#e0e0e0">
                <h1>Weekly Diet &amp; Exercise Tracker</h1>
                <p>Monitor your meals and workouts for a healthier lifestyle.</p>
            </td>
        </tr>
    </table>
        <iframe src="https://www.youtube.com/embed/Cbs6k8VUuNI" align="right" width="600px" height="400px"></iframe>
        
    <table>    
        <tr>
            <td align="left">
                <form>
                    <fieldset>
                        <legend><h4>Personal Info</h4></legend>

                        <table>
                            <tr>
                                <td>Name:</td>
                                <td><input type="text"></td>
                            </tr>
                            <tr>
                                <td>Age:</td>
                                <td><input type="text"></td>
                            </tr>
                            <tr>
                                <td>Gender</td>
                                <td><select name="gender">
                                    <option disabled selected>--Select--</option>
                                    <option>Male</option>
                                    <option>Female</option>
                                </select></td>
                            </tr>
                        </table>
                    </fieldset>
                        
                    <fieldset>
                        <legend><h4>Diet Tracking (Mon-Fri)</h4></legend>
                        
                        <table>
                            <tr>
                                <table cellpadding="2px" border="2px "width="50px">
                                    <tr align="left" width="10px">
                                        <td><b>Day</b></td>
                                        <td><b><center>Calories</center></b></td>
                                    </tr>
                                    <tr>
                                        <td>Mon</td>
                                        <td><input type="number"></td>
                                    </tr>    
                                    <tr>
                                        <td>Tue</td>
                                        <td><input type="number"></td>
                                    </tr>
                                    <tr>
                                        <td>Wed</td>
                                        <td><input type="number"></td>
                                    </tr>
                                    <tr>
                                        <td>Thu</td>
                                        <td><input type="number"></td>
                                    </tr>
                                    <tr>
                                        <td>Fri</td>
                                        <td><input type="number"></td>
                                    </tr>
                                </table>
                            </tr>
                        </table>
                    </fieldset>

                    <fieldset>
                        <legend><h4>Exercise (Mon-Fri)</h4></legend>
                        
                        <table>
                            <tr>
                                <table  border="2px "width="50px">
                                    <tr align="left" width="10px">
                                        <td><b>Day</b></td>
                                        <td><center><b>Minutes</b></center></td>
                                    </tr>
                                    <tr>
                                        <td>Mon</td>
                                        <td><input type="number"></td>
                                    </tr>    
                                    <tr>
                                        <td>Tue</td>
                                        <td><input type="number"></td>
                                    </tr>
                                    <tr>
                                        <td>Wed</td>
                                        <td><input type="number"></td>
                                    </tr>
                                    <tr>
                                        <td>Thu</td>
                                        <td><input type="number"></td>
                                    </tr>
                                    <tr>
                                        <td>Fri</td>
                                        <td><input type="number"></td>
                                    </tr>
                                </table>
                            </tr>
                        </table> 
                    </fieldset>
                    <br>
                </form>
            </td>
        </tr>
    </table>
    <button>Submit</button>
    <button>Reset</button>
</body>
</html>
