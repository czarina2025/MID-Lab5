<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Diet & Exercise Tracker</title>
</head>
<body margin="5px">
    <table width="90%" align="center" cellpadding="10" cellspacing="0">
        <tr>
            <td colspan="2" align="center" bgcolor="#e0e0e0">
                <h1>Weekly Diet &amp; Exercise Tracker</h1>
                <p>Monitor your meals and workouts for a healthier lifestyle.</p>
            </td>
        </tr>
      
        <tr vertical-align="top">
            <td width=50%>
                <form>
                    <fieldset>
                        <legend><h4>Personal Info</h4></legend>
                        
                        <table>
                            <tr>
                                <td>Name:</td>
                                <td><input type="text"></td>
                            </tr>
                            <tr>
                                <td>Age:</td>
                                <td><input type="text"></td>
                            </tr>
                            <tr>
                                <td>Gender</td>
                                <td><select name="gender">
                                    <option disabled selected>--Select--</option>
                                    <option>Male</option>
                                    <option>Female</option>
                                </select></td>
                            </tr>
                        </table>
                    </fieldset>
                        
                    <fieldset>
                        <legend><h4>Diet Tracking (Mon-Fri)</h4></legend>
                        <table border="1px" cellpadding "3" cellspacing="0">
                            <tr>
                                <table cellpadding="2px" border="2px "width="50px">
                                    <tr align="left" width="10px">
                                        <th>Day</th>
                                        <th>Calories</th>
                                    </tr>
                                    <tr>
                                        <td>Mon</td>
                                        <td><input type="number"></td>
                                    </tr>    
                                    <tr>
                                        <td>Tue</td>
                                        <td><input type="number"></td>
                                    </tr>
                                    <tr>
                                        <td>Wed</td>
                                        <td><input type="number"></td>
                                    </tr>
                                    <tr>
                                        <td>Thu</td>
                                        <td><input type="number"></td>
                                    </tr>
                                    <tr>
                                        <td>Fri</td>
                                        <td><input type="number"></td>
                                    </tr>
                                </table>
                            </tr>
                        </table>
                    </fieldset>

                    <fieldset>
                        <legend><h4>Exercise (Mon-Fri)</h4></legend>
                        <table>
                            <tr>
                                <table  border="1px" cellpadding="3px" cellspacing="0">
                                    <tr align="left" width="10px">
                                        <th>Day</th>
                                        <th>Minutes</th>
                                    </tr>
                                    <tr>
                                        <td>Mon</td>
                                        <td><input type="number"></td>
                                    </tr>    
                                    <tr>
                                        <td>Tue</td>
                                        <td><input type="number"></td>
                                    </tr>
                                    <tr>
                                        <td>Wed</td>
                                        <td><input type="number"></td>
                                    </tr>
                                    <tr>
                                        <td>Thu</td>
                                        <td><input type="number"></td>
                                    </tr>
                                    <tr>
                                        <td>Fri</td>
                                        <td><input type="number"></td>
                                    </tr>
                                </table>
                            </tr>
                        </table> 
                    </fieldset>
                    <br>
                    <button>Submit</button>
                    <button>Reset</button>
                </form>
            </td>
            <td align="center">
                <iframe width="600" height="400 src="https://www.youtube.com/embed/Cbs6k8VUuNI"></iframe>
                <p>Watch this video for tips on healthy eating and exercise!</p>
            </td>
        </tr>
    </table>
</body>
</html>
